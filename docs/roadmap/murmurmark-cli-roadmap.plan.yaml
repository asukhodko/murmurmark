version: 3

meta:
  id: murmurmark-cli-roadmap
  title: "MurmurMark CLI roadmap"
  effort_unit: "points"

statuses:
  done:
    label: "Сделано"
    color: "#22c55e"
  current:
    label: "В работе"
    color: "#0ea5e9"
  next:
    label: "Следующая разблокированная цель"
    color: "#f59e0b"
  later:
    label: "Зависимый этап"
    color: "#8b5cf6"
  idea:
    label: "Исследовательская гипотеза"
    color: "#9ca3af"
  optional:
    label: "Необязательная возможность"
    color: "#94a3b8"
  blocked:
    label: "Заблокировано"
    color: "#ef4444"

nodes:
  murmurmark-cli:
    title: "MurmurMark CLI"
    kind: summary
    status: current
    effort: 182
    notes: |
      Активная CLI-first, local-first и evidence-backed программа. Batch transcript остаётся
      authoritative. В работе одновременно может быть только одна исполнимая продуктовая цель.
      Подробная история экспериментов сохранена в
      docs/history/murmurmark-cli-roadmap-through-2026-07-19.plan.yaml.

  working-capabilities:
    title: "Работающие возможности"
    kind: phase
    parent: murmurmark-cli
    status: done
    effort: 45
    notes: |
      Подтверждённая основа продукта. Эти возможности поддерживаются regression-тестами, но не
      считаются активной разработкой только из-за постоянного использования.

  capability-durable-capture:
    title: "Durable two-track capture и session package"
    kind: task
    parent: working-capabilities
    status: done
    effort: 8
    notes: "Raw mic/remote CAF, capture health, partial/silent/sparse gates и неизменяемые inputs."

  capability-echo-preprocess:
    title: "Echo Guard и speech preprocessing"
    kind: task
    parent: working-capabilities
    status: done
    effort: 6
    notes: |
      Personalized Speaker-Preserving Neural Echo v2 продвинут для совместимых speaker-playback
      сессий. Он подаёт candidate audio напрямую в whisper.cpp и транзакционно публикует результат;
      headphones, stale/missing evidence и любые regressions выбирают exact local_fir fallback.

  capability-authoritative-transcript:
    title: "Authoritative batch transcript"
    kind: task
    parent: working-capabilities
    status: done
    effort: 9
    notes: |
      Resumable whisper.cpp processing, timeline repair, fast authoritative handoff и isolated
      profiles. `local_speech_completion_v2` выбран для frozen promotion scope;
      `residual_local_recall_v1` остаётся fallback для остальных сессий.

  capability-review-evidence:
    title: "Audit, evidence и review loop"
    kind: task
    parent: working-capabilities
    status: done
    effort: 7
    notes: "Frozen queues, local audio judges, review decisions, provenance и guarded profile selection."

  capability-notes-export:
    title: "Evidence notes, verdict, export и retention"
    kind: task
    parent: working-capabilities
    status: done
    effort: 6
    notes: |
      Deterministic notes, quality verdict, guarded Markdown/Obsidian export, raw retention plan и
      безопасная compaction пересоздаваемого derived audio с opt-out для debug-сессий.

  capability-derived-compaction:
    title: "Thin-session derived compaction"
    kind: task
    parent: working-capabilities
    status: done
    effort: 3
    notes: |
      `retention compact plan|apply|verify` сохраняет raw CAF и structured evidence, удаляет только
      allowlisted media внутри derived, пропускает pinned corpus sessions и автоматически
      применяется после успешного guarded export без `--keep-debug-artifacts`.

  capability-live-shadow:
    title: "Capture-safe Live Shadow"
    kind: task
    parent: working-capabilities
    status: done
    effort: 5
    notes: |
      Committed-PCM sidecar даёт advisory preview и fail-open isolation. Live output не участвует
      в authoritative transcript, export или retention.

  capability-cli-release-foundation:
    title: "CLI installation и open-source foundation"
    kind: task
    parent: working-capabilities
    status: done
    effort: 4
    notes: "doctor, self-test, acceptance, local installer, public docs, license и readiness checks."

  product-one-command-meeting-lifecycle-v1:
    title: "One-Command Meeting Lifecycle v1"
    kind: task
    parent: murmurmark-cli
    deps: [working-capabilities, corpus-regression]
    status: done
    effort: 8
    notes: |
      Свести обычную встречу к `murmurmark meeting`: durable capture, первый Ctrl-C, plain
      authoritative process, bounded enrich, safe suggested review, guarded finish и честный
      ready/ready_with_review/failed summary. Supervisor lock/journal/checkpoints/resume обязателен;
      raw CAF проверяется SHA-256 до и после обработки. Реализация, local install, release self-test,
      fresh permission-capable capture soak и strict lifecycle acceptance пройдены. Ранний Ctrl-C
      при заданном --duration также финализирует raw и запускает lifecycle безопасно. Capture
      изолирован в короткоживущем child process: ScreenCaptureKit/ReplayKit освобождается до
      post-processing, а зависший startup ограничен timeout и не удерживает recording lock.

  corpus-regression:
    title: "Corpus regression и evidence store"
    kind: phase
    parent: murmurmark-cli
    status: done
    effort: 12
    notes: |
      Постоянно используемая, но уже реализованная возможность: frozen inputs, labels, corpus
      reports, per-session gates и решения PROMOTE/DO_NOT_PROMOTE.

  quality-residual-local-recall-closure-v1:
    title: "Residual Local Recall Closure v1"
    kind: task
    parent: murmurmark-cli
    deps: [working-capabilities, corpus-regression]
    status: done
    effort: 8
    notes: |
      Завершено с PROMOTE_RESIDUAL_LOCAL_RECALL_V1. Все 13 строк / 48.073s классифицированы;
      безопасно закрыты 9 строк / 26.953s без вставки новых Me utterances. Четыре неоднозначные
      строки остались явными; audio-review и chronology очереди не изменены.

  quality-residual-chronology-closure-v1:
    title: "Residual Chronology Closure v1"
    kind: task
    parent: murmurmark-cli
    deps: [quality-residual-local-recall-closure-v1, corpus-regression]
    status: done
    effort: 7
    notes: |
      Завершено внутри Speaker-Mode Hardening с измеренным evidence ceiling: 3 lossless retime /
      15.530s и 1 подтверждённый double-talk / 1.460s; 10 строк оставлены needs_review. Слова, роли,
      local-recall insertion и audio dispositions не изменены.

  quality-operational-rebaseline-v1:
    title: "Operational Rebaseline v1"
    kind: task
    parent: murmurmark-cli
    deps: [quality-residual-chronology-closure-v1]
    status: done
    effort: 5
    notes: |
      Выполнено корпусом Speaker-Mode Hardening: paired local recall, chronology, duplicate/leak,
      runtime, review burden и latest-session gates пересчитаны. Root cause локализован в смешанных
      Me utterances, где remote span соседствует с уникальным local content.

  quality-speaker-mode-hardening-v1:
    title: "Speaker-Mode Transcript Quality Hardening v1"
    kind: task
    parent: murmurmark-cli
    deps: [quality-operational-rebaseline-v1, corpus-regression]
    status: done
    effort: 10
    notes: |
      Завершено с воспроизводимым DO_NOT_PROMOTE. 18 acoustic / 22 profile sessions заморожены;
      acoustic classifier совпал с 17/17 labels; sparse limiter поднял accepted Echo candidates
      11 -> 13. Из 73 risk rows доказаны 3 retime, 1 double-talk и 1 genuine Me, но safe whole-Me
      drops отсутствуют. Duplicate reduction 2.7%, review reduction 7.9%; профиль не выбран.

  quality-evidence-backed-me-completion-v2:
    title: "Evidence-Backed Me Completion v2"
    kind: task
    parent: murmurmark-cli
    deps: [quality-speaker-mode-hardening-v1, corpus-regression]
    status: done
    effort: 8
    notes: |
      Завершено с PROMOTE_LOCAL_SPEECH_COMPLETION_V2 для frozen two-session scope. Все 6 residual
      local-recall rows / 35.85s получили stable outcomes; 3 rows / 22.4s закрыты безопасно, два
      bounded local fragments материализованы, один уже присутствовал. Повреждённый duplicate text
      tail удалён; 3 ambiguous rows / 13.45s и все unresolved Me text flags имеют executable review
      lanes. Raw/input/remote/chronology/notes/verdict не регрессировали, повторный run byte-stable.

  quality-mixed-utterance-separation-v1:
    title: "Mixed-Utterance Remote Span Separation v1"
    kind: task
    parent: murmurmark-cli
    deps: [product-one-command-meeting-lifecycle-v1, quality-evidence-backed-me-completion-v2, corpus-regression]
    status: done
    effort: 9
    notes: |
      Завершено с воспроизводимым DO_NOT_PROMOTE. Заморожены 12 mixed-Me rows / 54.940s в 7
      сессиях; все получили deterministic word/audio/Target-Me provenance. 7 rows классифицированы
      probable_asr_noise, 5 ambiguous, но ни одна не доказала одновременно removable remote span и
      identity каждого local island. Изменений transcript нет; raw/input/remote/local
      recall/chronology/notes/verdict не регрессировали.

  quality-echo-suppression-promotion:
    title: "Echo Suppression Promotion"
    kind: task
    parent: murmurmark-cli
    deps: [quality-mixed-utterance-separation-v1, corpus-regression]
    status: done
    effort: 10
    notes: |
      Завершено с воспроизводимым DO_NOT_PROMOTE. На 9 frozen sessions
      coverage_v2_remote_gate_local_fir уменьшил bounded ASR-visible remote-risk на 68.2845% и
      уложился в runtime, но прошёл только 3/5 speaker-playback sessions. На двух контрпримерах
      protected-local retention упал до 45.45%, chronology recall до 0%. Signed timeline, matrix и
      fail-open policy готовы; production остаётся на local_fir.

  quality-neural-residual-echo-v1:
    title: "Neural Residual Echo Suppression v1"
    kind: task
    parent: murmurmark-cli
    deps: [quality-echo-suppression-promotion, corpus-regression]
    status: done
    effort: 10
    notes: |
      Завершено с воспроизводимым DO_NOT_PROMOTE. Pinned Microsoft DEC удалил 100% bounded
      ASR-visible remote-risk на двух hard sessions, но protected-local recall упал до 45.45%,
      chronology и double-talk recall до 0%, а incremental runtime достиг 52.85% от local_fir.
      AECMOS не обнаружил потерю слов, поэтому остаётся secondary metric. Production не менялся.

  quality-speaker-preserving-echo-adaptation-corpus-v1:
    title: "Speaker-Preserving Echo Adaptation Corpus v1"
    kind: task
    parent: murmurmark-cli
    deps: [quality-neural-residual-echo-v1, corpus-regression]
    status: done
    effort: 9
    notes: |
      Завершено с воспроизводимым DO_NOT_TRAIN. Privacy и session-disjoint splits прошли,
      local-only target coverage составил 192s train и 96s dev. Ни один remote-only интервал
      не прошёл frozen confidence gate, поэтому measured echo supervision и synthetic pairs
      отсутствуют. Hard-test сохранил protected-local и chronology evidence, но дал лишь 6s
      double-talk и не подтвердил opening acknowledgements. Replay совпал для 414/414 файлов;
      production не менялся.

  quality-controlled-echo-supervision-lab-v1:
    title: "Controlled Echo Supervision Lab v1"
    kind: task
    parent: murmurmark-cli
    deps: [quality-speaker-preserving-echo-adaptation-corpus-v1, corpus-regression]
    status: done
    effort: 12
    notes: |
      Создать управляемый speaker-mode протокол, где remote-only echo, local-only target и
      synthetic double-talk имеют известное происхождение. Собрать минимум 4 train, 1 dev и
      1 controlled hard-test captures, проверить privacy, contamination, split isolation и
      oracle gates. Завершить READY_FOR_ADAPTATION либо точным DO_NOT_TRAIN; не обучать модель
      и не менять production. Завершено READY_FOR_ADAPTATION: 5 train, 1 dev и 1 hard-test capture,
      620s train local, 640s train remote, 1804s train synthetic, 124s dev local, 128s dev remote,
      352s dev synthetic и 68s hard double-talk. Replay 1465/1465, failed gates отсутствуют,
      fingerprint be7b68f3267a20bfbd2fcf186587107e4201517e4edb3abbda3287857b008ffd.
      Local-FIR residual устраняет raw Target-Me false positives без изменения frozen thresholds.

  research-reference-conditioned-target-me-separation-v1:
    title: "Reference-Conditioned Target-Me Separation v1"
    kind: task
    parent: murmurmark-cli
    deps: [research-speaker-preserving-neural-echo-v2, corpus-regression]
    status: done
    effort: 15
    notes: |
      Завершено DO_NOT_PROMOTE_REFERENCE_CONDITIONED_TARGET_ME_SEPARATION_V1, fingerprint
      e3c925f005f0e85e7dc22e555e2a25701a1b297372babcc3551339da861324a3. Oracle и bounded
      overfit прошли, но два deterministic train/dev кандидата прошли только 7/9 locked gates;
      лучший достиг 11.470/12 dB Target-Me и 7.788/8 dB echo SNR. Frozen train имел один fixed
      enrollment и 0 independently labelled non-target local-speech rows, поэтому semantic
      other_local attribution неидентифицируема. Hard-test и sealed 12-session corpus не открыты;
      production v2 остался byte-exact.

  quality-target-me-identifiability-corpus-v1:
    title: "Target-Me Identifiability Corpus v1"
    kind: task
    parent: murmurmark-cli
    deps: [research-reference-conditioned-target-me-separation-v1, corpus-regression]
    status: done
    effort: 10
    notes: |
      Завершено READY_FOR_TARGET_CONDITIONED_TRAINING, fingerprint
      530cb0fd23503884d438bc24be10fff45610da1fb8fe710aad1b6b6cd992b2ce. Корпус содержит
      4/2/2 split-disjoint non-target speakers, 1200/300/300s full mixtures, 490 items,
      980 paired correct/wrong queries и 11 split-local enrollments. Identity, source,
      enrollment и render-seed contamination равны нулю; exact replay 2470/2470,
      publication verification 2504/2504. Production v2 не менялся.

  research-reference-conditioned-target-me-separation-v2:
    title: "Reference-Conditioned Target-Me Separation v2"
    kind: task
    parent: murmurmark-cli
    deps: [quality-target-me-identifiability-corpus-v1, corpus-regression]
    status: done
    effort: 15
    notes: |
      Завершено DO_NOT_PROMOTE_REFERENCE_CONDITIONED_TARGET_ME_SEPARATION_V2, fingerprint
      5b9fb8ec1cbc84340bcda4245edfd1f2113493c8f73d8e7fc25bb0a572aab26c. v1 baseline
      воспроизведён точно. Единственный paired-query FiLM+GRU candidate детерминированно показал
      4.991 dB correct-vs-wrong margin и 0% collapse, но достиг лишь 4.852 dB Target-Me,
      4.107 dB non-target SNR и 8.293 dB absent-query attenuation. Immutable dev lock отклонил
      candidate; hard и sealed corpus остались unopened, production v2 byte-exact.

  product-evidence-export-v2:
    title: "Evidence Notes And Export v2"
    kind: task
    parent: murmurmark-cli
    deps: [research-reference-conditioned-target-me-separation-v2]
    status: done
    effort: 7
    notes: |
      Завершено. Versioned deterministic Evidence Handoff v2 связывает выбранный transcript
      profile, quality verdict, evidence notes, unresolved review burden и export readiness.
      Guarded Markdown/Obsidian export читает только ready или verified no_speech handoff; `--force`
      не обходит integrity/review gates. На 110 сессиях валидны 110/110 манифестов, stale,
      referential-integrity и deterministic-replay failures равны нулю; corpus gate PASS.

  product-release-quality-cli:
    title: "Release-quality CLI"
    kind: task
    parent: murmurmark-cli
    deps: [product-evidence-export-v2]
    status: done
    effort: 7
    notes: |
      Завершено. Детерминированный versioned archive содержит полный SHA-256 inventory,
      compatibility и license contracts. Install/upgrade идемпотентен и транзакционен, failed
      upgrade сохраняет предыдущую версию. Изолированный offline acceptance проверяет packaged
      doctor, self-test, Evidence Handoff v2 и guarded export; workspace и session inputs внешние.

  product-reliable-final-handoff-v1:
    title: "Reliable Final Handoff v1"
    kind: task
    parent: murmurmark-cli
    deps: [product-release-quality-cli, corpus-regression]
    status: done
    effort: 8
    notes: |
      Завершено. Optional heavy candidates отделены от первого handoff, enrichment ограничен
      явным бюджетом, resume и safe suggested review проверяются по свежим fingerprints, а
      terminal review публикуется как bounded manual decisions. Frozen cache/resume corpus проходит
      3/3 с p90 ratio 0.059041, без dead ends/stale handoffs; SPNE exact reuse проходит 2/2.

  product-authoritative-incremental-asr-v1:
    title: "Authoritative Incremental ASR v1"
    kind: task
    parent: murmurmark-cli
    deps: [product-reliable-final-handoff-v1, corpus-regression]
    status: done
    effort: 8
    notes: |
      Завершено split decision. Strict v2 identity, atomic completion, integrity и byte-identical
      interrupted-batch replay — PROMOTE. Историческая median cache reduction 0.989398. Live-origin
      — DO_NOT_PROMOTE: 0/30 authoritative proofs на трёх real sessions; fallback остаётся batch ASR.

  product-canonical-live-asr-producer-v1:
    title: "Canonical Live ASR Producer v1"
    kind: task
    parent: murmurmark-cli
    deps: [product-authoritative-incremental-asr-v1, corpus-regression]
    status: done
    effort: 8
    notes: |
      Завершено DO_NOT_PROMOTE. Remote producer даёт exact canonical 60s/5s chunks и strict parity
      3/3, но historical replay не заменяет recording-time evidence, а modeled wall reduction всего
      2.8651%..4.1040% из-за параллельного mic critical-path. Обычный live не запускает producer;
      evidence flag и promotion gate сохраняют quarantine и batch fallback.

  product-causal-canonical-mic-asr-v1:
    title: "Causal Canonical Mic ASR v1"
    kind: task
    parent: murmurmark-cli
    deps: [product-canonical-live-asr-producer-v1, corpus-regression]
    status: done
    effort: 8
    notes: |
      Завершено DO_NOT_PROMOTE. На трёх frozen real sessions ни одно из 147 raw-fallback окон не
      совпало с final canonical mic; exact hard audio 0/8743.1315s. Prefix 5/30/120s также не дал
      byte-identical local-FIR PCM. Текущие Echo statistics, delay/fit и guarded branch selection
      имеют session-end causal boundary. Raw capture, batch и production defaults не изменены.

  parallel-research:
    title: "Параллельные исследования"
    kind: phase
    parent: murmurmark-cli
    status: idea
    effort: 24
    notes: |
      Эти гипотезы могут создавать isolated evidence, но не блокируют критический CLI-путь и не
      меняют production defaults без собственных corpus gates.

  research-remote-diarization:
    title: "Remote Speaker Evidence Map v1"
    kind: task
    parent: murmurmark-cli
    deps: [quality-operational-rebaseline-v1, corpus-regression, product-causal-canonical-mic-asr-v1]
    status: current
    effort: 6
    notes: |
      Разделить authoritative remote на стабильные anonymous speaker intervals и audit-only rich
      transcript с полной provenance. Измерить deterministic replay, chunk/whole-file cluster
      consistency, single-speaker false splits, overlap uncertainty и lossless text attribution.
      Missing/weak evidence даёт aggregate Colleagues. Не присваивать имена, не менять selected
      transcript, Evidence Handoff v2 и export до отдельного corpus-wide PROMOTE.

  research-speaker-map:
    title: "Speaker map"
    kind: task
    parent: parallel-research
    deps: [research-remote-diarization]
    status: idea
    effort: 5
    notes: "Привязывать устойчивые speaker clusters к именам только по evidence или review."

  research-rich-transcript:
    title: "transcript.rich.json"
    kind: task
    parent: parallel-research
    deps: [research-speaker-map]
    status: idea
    effort: 5
    notes: "Единый формат speaker IDs, confidence, alignment, evidence и review decisions."

  research-heavy-local-validators:
    title: "Heavy local ASR/audio validators"
    kind: task
    parent: parallel-research
    deps: [quality-operational-rebaseline-v1, corpus-regression]
    status: idea
    effort: 4
    notes: "Тяжёлые локальные модели сначала работают как bounded judges, не как обязательный ASR."

  research-speaker-preserving-neural-echo-v2:
    title: "Speaker-Preserving Neural Echo v2"
    kind: task
    parent: murmurmark-cli
    deps: [quality-controlled-echo-supervision-lab-v1]
    status: done
    effort: 14
    notes: |
      Завершено PROMOTE_SPEAKER_PRESERVING_NEURAL_ECHO_V2. Победил guarded hybrid v2.15:
      personalized WavLM/Resemblyzer и remote evidence выбирают bounded attenuation, direct
      whisper.cpp и window/full-shadow gates откатывают небезопасные места. Sealed corpus v2.16:
      5/12 candidate, 7/12 exact fallback, 41.940s и 90 remote tokens удалены, local retention 1.0,
      post-ASR credit 0. Headphones, missing/stale evidence и regressions остаются на exact local_fir.

  research-evidence-guarded-llm:
    title: "Evidence-guarded LLM synthesis"
    kind: task
    parent: parallel-research
    deps: [research-rich-transcript, product-evidence-export-v2]
    status: idea
    effort: 4
    notes: "Generated claims обязаны ссылаться на evidence IDs; unsupported claims отклоняются."

  parking-lot:
    title: "Parking lot"
    kind: phase
    parent: murmurmark-cli
    status: optional
    effort: 15
    notes: "Полезные возможности без влияния на текущую сходимость CLI."

  parked-live-promotion:
    title: "Live result promotion"
    kind: task
    parent: parking-lot
    deps: [capability-live-shadow, corpus-regression]
    status: blocked
    effort: 5
    notes: |
      Заблокировано воспроизводимыми quality/runtime DO_NOT_PROMOTE. Возобновлять только с новой
      гипотезой, которая проходит immutable corpus и live-vs-batch parity gates.

  parked-reviewed-integrations:
    title: "Docs and issue-tracker proposals"
    kind: task
    parent: parking-lot
    deps: [product-evidence-export-v2]
    status: optional
    effort: 4
    notes: "Только reviewed proposals; никаких автоматических внешних записей без подтверждения."

views:
  roadmap-tree:
    title: "Полный активный roadmap"
    lanes:
      root:
        title: "MurmurMark CLI"
        expand_descendants: leaves
        nodes: [murmurmark-cli]

  near-term:
    title: "Текущий фокус"
    lanes:
      working:
        title: "Готовая основа"
        nodes: [working-capabilities, corpus-regression]
      current:
        title: "Единственная исполнимая цель"
        nodes: [research-remote-diarization]
      dependent:
        title: "После anonymous remote evidence"
